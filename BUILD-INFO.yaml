# Provenance manifest for this onnxruntime-prebuilt release.
# Every binary in ort_w_ep/ and ort_wo_ep/ can be rebuilt from exactly these inputs.
# Installed on the target as /usr/share/onnxruntime-prebuilt/BUILD-INFO.yaml.

release:
  onnxruntime_prebuilt_branch: v1.26.0
  onnxruntime_prebuilt_tag: v1.26.0-ep0.3.1        # <ORT version>-ep<EP release>
  onnxruntime_version: 1.26.0
  ep_release: 0.3.1                                 # semver of the EP + op-capability pair (lockstep)
  ep_release_tag: plugin-ep-neuropilot/v0.3.1       # tag to create in the internal mirrors of both EP repos (not done: no mirror of the 0.3.0 drops yet)
  supersedes: v1.26.0-ep0.2.1
  reason_for_0.3.1: >
    Rebases the Genio EP fixes onto the upstream 0.3.0 source drops of both repos
    (onnxruntime-ep-neuropilot 0.3.0, libneuron-op-capability 0.3.0).  0.3.1 = upstream
    0.3.0 + our local patches.  ABI BREAK vs 0.2.x: 0.3.0 replaced the C++
    CreateOpCapabilityRegistrations interface with the C ABI v1 (NeuronCap*, exact version
    check), so the EP and op-capability libraries of 0.2.x and 0.3.x cannot be mixed in
    either direction -- always install both from this release.  ORT binaries are unchanged
    (byte-identical to v1.26.0-ep0.2.1); only the two EP libraries change.
    Upstream 0.3.0 adds: dma-buf zero-copy (NeuronEp_RegisterDmabuf), payload-elided graph
    hand-off to op-capability, MDLA float-quantize probe, NEURON_FLAG_COMPUTE_LIGHT_MIN_NODES
    (default 16; 0 = drop every compute-light partition as 0.2.x did) and
    NEURON_FLAG_SKIP_NODE_PREFIXES.  Our patch 0003 (Reduction axes) is dropped: upstream
    0.3.0 has the equivalent fix.  Patch 0007 (re-partition around compiler-refused nodes),
    held back in 0.2.1, ships now.
  built_on: 2026-11-09
  target: "aarch64-linux-gnu (Genio scarthgap: glibc 2.39, libstdc++ from GCC 13, Python 3.12)"
  previous_release: "v1.26.0-ep0.2.1 @ 40b0c612ad0999e377c9b95392956c85be4b4ca0"

sources:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime.git
    tag: v1.26.0
    commit: 8c546c37b43caaca1fa25db430dab94b901cf277
    submodules:
      cmake/external/onnx: be2b5fde82d9c8874f3d19328bdfe3b6962dc67b   # v1.21.0
      cmake/external/emsdk: c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56   # 4.0.23 (unused on Linux)
      cmake/external/libprotobuf-mutator: 7a2ed51a6b682a83e345ff49fc4cfd7ca47550db   # unused
    other_deps: cmake/deps.txt of the tag (FetchContent, pinned by hash there)
  onnxruntime_ep_neuropilot:
    upstream: onnxruntime-ep-neuropilot 0.3.0 source drop (tarball, no .git)
    upstream_tarball: onnxruntime-ep-neuropilot-0.3.0.tar.gz
    upstream_tarball_sha256: 183436efcd9863594dc9f1a47ead5c6124e027815db68b984d70353a2b3dad02
    release_tag: plugin-ep-neuropilot/v0.3.1
    local_patches:
      # One squashed patch against the 0.3.0 drop; carries forward 0.2.1's EP patches
      # 0001, 0002, 0004, 0005, 0006 and adds 0007.  0003 dropped (in upstream 0.3.0).
      #   0001 GridSample: MTKEXT_GRID_SAMPLE_2D on NeuroPilot < 9 + single-node runtime probe
      #        (still required: 0.3.0 emits core op 111, which no 8.x adapter defines)
      #   0002 NEURON_FLAG_GRIDSAMPLE_ABS_GRID
      #   0004 Squeeze/Unsqueeze: axes initializers in raw_data
      #   0005 InstanceNorm/BatchNorm: recognise com.ms.internal.nhwc
      #   0006 NEURON_FLAG_MAX_PARTITION_NODES
      #   0007 GetCapability: exclude only compiler-refused nodes, then re-partition
      - file: 0001-Rebase-the-Genio-EP-fixes-onto-onnxruntime-ep-neurop.patch
        sha256: 1a36b6d57c5670a403bdfbc592b2ceaded752dc4309975527131f2af6131917d
    ort_headers_used: onnxruntime v1.26.0
    fetched_deps: {protobuf: v21.12, onnx: e709452ef2bbc1d113faf678c24e6d3467696e83 (v1.18.0), GSL: v4.0.0}
  libneuron_op_capability:
    upstream: libneuron-op-capability 0.3.0 source drop (tarball, no .git; CONFIDENTIAL)
    upstream_tarball: libneuron-op-capability-v0.3.0.tar.gz
    upstream_tarball_sha256: aac314a348c5930149619a6d903d80a55a2263786c674f18f43bbabc1d8c9cd6
    abi: NEURON_CAP_ABI_VERSION 1 (exports exactly the six NeuronCap* entry points)
    release_tag: plugin-ep-neuropilot/v0.3.1        # same number as the EP (lockstep pair)
    local_patches:
      - file: 0002-InstanceNormalization-BatchNormalization-claim-NCHW-.patch
        sha256: 6539341e2ae905322618c0dc2a0ec59f9f3a668df8a2f0f99731375618f1c683
        summary: same change as 0.2.1's e32c711 (claim NCHW IN/BN; IsNodeLayoutNHWC checks NodeProto::domain); not in upstream 0.3.0
    fetched_deps: {protobuf: v21.12, onnx: e709452ef2bbc1d113faf678c24e6d3467696e83 (v1.18.0), GSL: v4.0.0}
    built_with_ep_source: the patched EP tree above (NEURON_EP_SRC_DIR)
  patch_delivery: >
    Patches, build logs and board logs were delivered as ep-0.3.0-rebase-20261109T102129Z-1-001.zip
    (sha256 c8e92a9531fd134ceb20bb3c12308a2a20012e2e9f3f9845eaca87c09e3850ca); patch contents are
    not stored here because the op-capability one is confidential.  The squashed EP patch was
    cross-checked against an independent forward-port of the same six patches: identical
    except for one 3-line comment.
  runtime_requirements:
    neuropilot_runtime: ">= 8.2.16"   # libneuronusdk_adapter.mtk.so, dlopen()ed by the EP
    neuropilot_prebuilts_validated: https://gitlab.com/mediatek/aiot/rity/mtk-neuropilot-prebuilts.git scarthgap @ d2f5bf8efb5dd550af8d303e7b773df3e1cc45b9 (neuron/8 + mvpu/25, GridSample-on-MVPU fix)
  tooling_in_this_repo:
    onnxruntime_benchmark.py: rewritten for this release (Yocto_onnxruntime/build/tools)
    label_image.py: previous release + NeuroPilotExecutionProvider option

build_environment:
  host: Apple Silicon macOS, Colima aarch64 VM, Docker; native aarch64 build (no cross toolchain)
  image: ort-build:ubuntu24.04 built from build-scripts/docker/Dockerfile
  base_image: ubuntu@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254   # ubuntu:24.04 (24.04.4 LTS)
  gcc: 13.3.0 (Ubuntu 13.3.0-6ubuntu2~24.04.1)
  glibc: 2.39 (Ubuntu GLIBC 2.39-0ubuntu8.8)
  cmake: 3.28.3
  ninja: 1.11.1
  python: 3.12.3
  numpy: 1.26.4
  protoc: 3.21.12
  scripts: build-scripts/build_ort_in_container.sh, build-scripts/build_ep_in_container.sh, build-scripts/assemble_prebuilt.sh

build_configuration:
  onnxruntime:
    command: >
      python3 tools/ci_build/build.py --build_dir build/Linux --config Release --parallel 6 --skip_tests
      --skip_submodule_sync --allow_running_as_root --build_shared_lib --build_wheel --use_xnnpack
      --compile_no_warning_as_error --cmake_extra_defines CMAKE_INSTALL_PREFIX=/usr onnxruntime_BUILD_UNIT_TESTS=OFF
    perf_test: cmake -Donnxruntime_BUILD_UNIT_TESTS=ON . && cmake --build . --target onnxruntime_perf_test
    execution_providers: [CPU, XNNPACK]   # NPU is the out-of-tree plugin EP below
  libneuron_op_capability:
    command: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEURON_EP_SRC_DIR=<ep>/src/neuron_plugin_ep
  onnxruntime_ep_neuropilot:
    command: >
      cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
      -DORT_INCLUDE_DIR=<onnxruntime>/include/onnxruntime/core/session
      -DNEURON_OP_CAPABILITY_LIB_DIR=<dir with libneuron_op_capability.so>

