# Provenance manifest for this onnxruntime-prebuilt release.
# Every binary in ort_w_ep/ and ort_wo_ep/ can be rebuilt from exactly these inputs.
# Installed on the target as /usr/share/onnxruntime-prebuilt/BUILD-INFO.yaml.

release:
  onnxruntime_prebuilt_branch: v1.26.0
  onnxruntime_prebuilt_tag: v1.26.0-ep0.2.0        # <ORT version>-ep<EP release>
  onnxruntime_version: 1.26.0
  ep_release: 0.2.0                                 # semver of the EP + op-capability pair (lockstep)
  ep_release_tag: plugin-ep-neuropilot/v0.2.0       # tag to create in the internal mirrors of both EP repos at the commits below
  built_on: 2026-10-02
  target: aarch64-linux-gnu (Genio scarthgap: glibc 2.39, libstdc++ from GCC 13, Python 3.12)
  previous_release: v1.26.0-ep0.1.0 @ e3c0f1c810aa1ca26fc6fd747d8435e50776435c

sources:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime.git
    tag: v1.26.0
    commit: 8c546c37b43caaca1fa25db430dab94b901cf277
    submodules:
      cmake/external/onnx: be2b5fde82d9c8874f3d19328bdfe3b6962dc67b   # v1.21.0
      cmake/external/emsdk: c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56   # 4.0.23 (unused on Linux)
      cmake/external/libprotobuf-mutator: 7a2ed51a6b682a83e345ff49fc4cfd7ca47550db   # unused
    other_deps: cmake/deps.txt of the tag (FetchContent, pinned by hash there)
  onnxruntime_ep_neuropilot:
    url: https://gitlab.collabora.com/mediatek/private/onnxruntime-ep-neuropilot.git
    branch: gridsample-mtkext (continues mdla-correctness-fixes)
    base_commit: cd5e9f67393f3aefcfc4d1d5fd9ece4216d2f579   # mdla-correctness-fixes tip the v0.1.0 release shipped
    release_tag: plugin-ep-neuropilot/v0.2.0        # internal mirror tag pinning this commit
    local_patches:
      # Applied on top of base_commit (cd5e9f67), per-patch commit SHAs below. GridSample
      # is the primary fix (gp5100_npu/mvpu_info/gridsample/0001-*.patch); 0002-0006 are
      # EP robustness fixes found and validated along the way (see gridsample-5100-
      # candidate-1004/README.md v4-v6 and gp5100_npu/mvpu_info/EP_GridSample_bug_report.md).
      - 0516b21115d7e610836d97a8e581aa6b802da2e7  GridSample: lower via MTKEXT extension on NeuroPilot < 9 and confirm runtime support before claiming.
      - 338a8dc6559fc04b6931e267631cc77d4fcf3107  GridSample: add NEURON_FLAG_GRIDSAMPLE_ABS_GRID to pre-normalize the grid.
      - 691740fd36be27deb7985f99f8b5c5b1734fcb16  Reduction: take axes from input[1] when present instead of the axes attribute.
      - 03df8683dd2f291eed1caafda86ced92523468ea  Squeeze/Unsqueeze: read axes initializers stored in raw_data.
      - 4d105d37ad38622d70363aa4c7a490065e37a879  InstanceNormalization/BatchNormalization: recognise optional inputs correctly.
      - ded7c399429b9d58d165b00fb647249aa7cbc512  Add NEURON_FLAG_MAX_PARTITION_NODES to cap the node count per partition.
    # NOTE: this repo has no network path to gitlab.collabora.com from the dev host that
    # produced this update, so base_commit/local_patches above could not be independently
    # re-verified against the live repo (per VERSIONING-style convention elsewhere in this
    # org: honest gap, not a guess). Confirmed by the engineer who built/validated this
    # release that it continues mdla-correctness-fixes @ cd5e9f67 (not Collabora main) --
    # earlier project notes (gp5100_npu/mvpu_info/neuron-build-dev-notes.md) said "main
    # fc79119", which was wrong; fix that doc too.
    ort_headers_used: onnxruntime v1.26.0 (ORT_API_VERSION 26; EP negotiates down to 23)
    fetched_deps: {protobuf: v21.12, onnx: e709452ef2bbc1d113faf678c24e6d3467696e83 (v1.18.0), GSL: v4.0.0}
  libneuron_op_capability:
    url: https://gitlab.collabora.com/mediatek/private/libneuron-op-capability.git
    branch: yolo-int8 (merged to main @ 48df2e4 per this build)
    commit: 48df2e4   # NOTE: short ref from gp5100_npu/mvpu_info/neuron-build-dev-notes.md,
                       # not independently re-verified (no repo access from this host).
    release_tag: plugin-ep-neuropilot/v0.2.0        # same number as the EP (lockstep pair)
    note: >
      No source change from the v0.1.0 release (yolo-int8 @ 9f42ddc, same
      QuantizeLinear/DequantizeLinear registrations); rebuilt alongside the new EP.
      Binary differs (new sha256) because of that rebuild, not a logic change.
    local_patches: none
    fetched_deps: {protobuf: v21.12, onnx: e709452ef2bbc1d113faf678c24e6d3467696e83 (v1.18.0), GSL: v4.0.0}
    built_with_ep_source: same onnxruntime-ep-neuropilot commit as above (NEURON_EP_SRC_DIR)
  runtime_requirements:
    neuropilot_runtime: ">= 8.2.16"   # libneuronusdk_adapter.mtk.so, dlopen()ed by the EP
    neuropilot_prebuilts_validated: https://gitlab.com/mediatek/aiot/rity/mtk-neuropilot-prebuilts.git scarthgap @ d2f5bf8efb5dd550af8d303e7b773df3e1cc45b9 (neuron/8 + mvpu/25, GridSample-on-MVPU fix)
  tooling_in_this_repo:
    onnxruntime_benchmark.py: rewritten for this release (Yocto_onnxruntime/build/tools)
    label_image.py: previous release + NeuroPilotExecutionProvider option

build_environment:
  host: Apple Silicon macOS, Colima aarch64 VM, Docker; native aarch64 build (no cross toolchain)
  image: ort-build:ubuntu24.04 built from build-scripts/docker/Dockerfile
  base_image: ubuntu@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254   # ubuntu:24.04 (24.04.4 LTS)
  gcc: 13.3.0 (Ubuntu 13.3.0-6ubuntu2~24.04.1)
  glibc: 2.39 (Ubuntu GLIBC 2.39-0ubuntu8.8)
  cmake: 3.28.3
  ninja: 1.11.1
  python: 3.12.3
  numpy: 1.26.4
  protoc: 3.21.12
  scripts: build-scripts/build_ort_in_container.sh, build-scripts/build_ep_in_container.sh, build-scripts/assemble_prebuilt.sh

build_configuration:
  onnxruntime:
    command: >
      python3 tools/ci_build/build.py --build_dir build/Linux --config Release --parallel 6 --skip_tests
      --skip_submodule_sync --allow_running_as_root --build_shared_lib --build_wheel --use_xnnpack
      --compile_no_warning_as_error --cmake_extra_defines CMAKE_INSTALL_PREFIX=/usr onnxruntime_BUILD_UNIT_TESTS=OFF
    perf_test: cmake -Donnxruntime_BUILD_UNIT_TESTS=ON . && cmake --build . --target onnxruntime_perf_test
    execution_providers: [CPU, XNNPACK]   # NPU is the out-of-tree plugin EP below
  libneuron_op_capability:
    command: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEURON_EP_SRC_DIR=<ep>/src/neuron_plugin_ep
  onnxruntime_ep_neuropilot:
    command: >
      cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
      -DORT_INCLUDE_DIR=<onnxruntime>/include/onnxruntime/core/session
      -DNEURON_OP_CAPABILITY_LIB_DIR=<dir with libneuron_op_capability.so>

artifacts_sha256:
  ort_w_ep/usr/lib/libonnxruntime.so.1.26.0: af3184a9da0f6f128ddfd39d76201da6e8f04e17f234c09cd24899b9e737039c
  ort_w_ep/usr/lib/libonnxruntime_providers_shared.so: ec5466a571b44718e64b7e62605b7a87045df08bbaa2b7d67804208f22ab32d2
  ort_w_ep/usr/lib/libonnxruntime_providers_neuropilot.so: 815e2bd5ababc501c603210fd5f548dc1dcfa071a58efa0c589045c094d51f62
  ort_w_ep/usr/lib/libneuron_op_capability.so: fbb9ee12960f6c8c2418639512918da886455e8d85f6e89eb5ffa10126e2e019
  ort_w_ep/usr/lib/python3.12/site-packages/onnxruntime/capi/onnxruntime_pybind11_state.so: 93f716f224f0b41e4c459bbb2e8ffc3c23e41e1c12fd1bd11fe71108349876a4
  ort_w_ep/usr/share/onnxruntime_benchmark/onnxruntime_perf_test: 033034dee9377a3ef2408bf073a40d6a1a0f68f22050f4bcc38f875e99583cbc
  wheel_onnxruntime-1.26.0-cp312-cp312-linux_aarch64.whl: c0ed8e1f925c047bf1a0b88d8ba9c5e0b7bdc3b86edd09e1e07e93f1dbab26d3
  note: ort_wo_ep/ shares the same ORT binaries (byte-identical); it only omits the two EP libraries.

validation:
  - board: Genio 720 EVK UFS, rity-demo 26.0-dev scarthgap, kernel 6.6.137-mtk, NeuroPilot 8.2.16
    date: 2026-09-10
    reference_model: yolo11s_480_int8.onnx (ml-test-models) with inputs/bus_480.npy
    expected: partitions=1 claimed 1054/1056, NPU p50 ~8 ms, cosine vs CPU 0.9999, cosine vs FP32 0.9998, 5/5 detections
    results_files: Yocto_onnxruntime/deliverables/results-genio720-ort1.26.0-*.json
    note: carried from v0.1.0; not re-run for v0.2.0, nothing here touches YOLO/QDQ paths.
  - board: Genio Pro 5100 EVK (MT8894/MVPU2.5), candidate test (LD_LIBRARY_PATH override, no reflash)
    date: 2026-10-02
    scope: GridSample on MVPU (v6) -- 18-shape sweep, 2 EP models, IGEV-RT regression, softmax/tanh regression
    expected: cos 0.994-0.99999 across the sweep; IGEV-RT 47.7 ms cosine 1.00000; unsupported combos
      (nearest/border/reflection) report unsupported at compile instead of silent garbage output
    known_residual: fp16 absolute-coord grid loses precision for H/W >= 200 (cos 0.997 @ 200px, 0.994 @ 300px)
    results_files: gp5100_npu/mvpu_info/gridsample-5100-candidate-1004/README.md (v6 section),
      gp5100_npu/mvpu_info/neuron-build-dev-notes.md
