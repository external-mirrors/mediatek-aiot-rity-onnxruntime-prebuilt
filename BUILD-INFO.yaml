  wheel_onnxruntime-1.26.0-cp312-cp312-linux_aarch64.whl: c0ed8e1f925c047bf1a0b88d8ba9c5e0b7bdc3b86edd09e1e07e93f1dbab26d3
  note: ort_wo_ep/ shares the same ORT binaries (byte-identical); it only omits the two EP libraries.

validation:
  - board: Genio 720 EVK UFS, rity-demo 26.0-dev scarthgap, kernel 6.6.137-mtk, NeuroPilot 8.2.16
    date: 2026-09-10
    reference_model: yolo11s_480_int8.onnx (ml-test-models) with inputs/bus_480.npy
    expected: partitions=1 claimed 1054/1056, NPU p50 ~8 ms, cosine vs CPU 0.9999, cosine vs FP32 0.9998, 5/5 detections
    results_files: Yocto_onnxruntime/deliverables/results-genio720-ort1.26.0-*.json
    note: carried from v0.1.0; not re-run for v0.2.0, nothing here touches YOLO/QDQ paths.
  - board: Genio Pro 5100 EVK (MT8894/MVPU2.5), candidate test (LD_LIBRARY_PATH override, no reflash)
    date: 2026-10-02
    scope: GridSample on MVPU (v6) -- 18-shape sweep, 2 EP models, IGEV-RT regression, softmax/tanh regression
    expected: cos 0.994-0.99999 across the sweep; IGEV-RT 47.7 ms cosine 1.00000; unsupported combos
      (nearest/border/reflection) report unsupported at compile instead of silent garbage output
    known_residual: fp16 absolute-coord grid loses precision for H/W >= 200 (cos 0.997 @ 200px, 0.994 @ 300px)
    results_files: gp5100_npu/mvpu_info/gridsample-5100-candidate-1004/README.md (v6 section),
      gp5100_npu/mvpu_info/neuron-build-dev-notes.md

  - board: Genio Pro 5100 EVK SKU1 (MT8894), NeuroPilot 8.2.16, kernel 7.3.0-rc5-next-20260928, governor performance
    date: 2026-11-09
    method: same run, 0.2.1 image EP (md5 d3a29fc0 / op-cap fc1a8f69) vs this EP (md5 37c4a53d / op-cap dba850d2)
      via LD_LIBRARY_PATH, /usr/lib untouched
    results: >
      RT-DETRv4 plain 5 partitions 1085/1094, p50 45.20 ms (0.2.1: 45.29); skipgs 7 partitions 1076/1094,
      p50 31.76 ms (31.83); partition/claim counts, CPU op lists and cosines identical to 0.2.1.
      IGEV-RT 1 partition 524/524, p50 45.93 ms, cosine 1.00000 (identical).  GridSample single-op,
      6 shapes: all on NPU via MTKEXT_GRID_SAMPLE_2D, cosine 0.99989-0.99999.
      NEURON_FLAG_MAX_PARTITION_NODES=128 on IGEV-RT: 5 partitions, 524/524, cosine 1.00000.
    results_files: ep-0.3.0-rebase/MATRIX-030.txt, VERIFY-030-2026-11-09-zh-TW.md, logs/ (in the delivery zip)
    not_covered: Genio 720 (yolo11s QDQ int8 reference) NOT re-run for 0.3.1; upstream 0.3.0 changed the QDQ
      partitioning paths, so G720 must be checked before relying on this release there.

release_gate:
  # v0.2.0 shipped unverified artifacts; from v0.2.1 on, check the binaries actually carry
  # the advertised patches BEFORE tagging.  Both commands must print a non-zero count.
  - strings ort_w_ep/usr/lib/libonnxruntime_providers_neuropilot.so | grep -c NEURON_FLAG_MAX_PARTITION_NODES   # EP patch 0006
  - strings ort_w_ep/usr/lib/libneuron_op_capability.so            | grep -c "NEURON_FLAG_USE_NCHW set"         # op-cap patch
  - strings ort_w_ep/usr/lib/libonnxruntime_providers_neuropilot.so | grep -c MTKEXT_GRID_SAMPLE_2D            # EP patch 0001
  - strings ort_w_ep/usr/lib/libonnxruntime_providers_neuropilot.so | grep -c "Re-partitioning (round"          # EP patch 0007
  - nm -D --defined-only ort_w_ep/usr/lib/libneuron_op_capability.so | grep -c NeuronCap                        # op-cap ABI v1: must print 6
  - sha256sum -c SHA256SUMS
